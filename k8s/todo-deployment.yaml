apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-list
  labels:
    app: todo-list
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-list
  template:
    metadata: 
      labels:
        app: todo-list
    spec:
      containers:
      - name: todo-list
        image: amaraiheanacho/amaratodo:latest
        ports:
        - containerPort: 8000
        env:
        - name: DEPLOYMENT
          valueFrom:
            configMapKeyRef:
              name: todo-configmap
              key: deployment
        - name: ENVIRONMENT
          valueFrom: 
            configMapKeyRef:
              name: todo-configmap
              key: environment
        - name: DB
          valueFrom:
            configMapKeyRef:
              name: todo-configmap
              key: db
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
                name: todo-configmap
                key: db_name


---
apiVersion: v1
kind: Service
metadata:
  name: todo-list-service
spec:
  selector: 
    app: todo-list
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30000
